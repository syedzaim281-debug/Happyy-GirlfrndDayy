<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Zainab ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(-45deg,#ff416c,#ff4b2b,#8e2de2,#ff758c);
    background-size:400% 400%;
    animation:bg 10s infinite alternate;
}

@keyframes bg{
    0%{background-position:left;}
    100%{background-position:right;}
}

.container{
    width:90%;
    max-width:520px;
    padding:35px;
    text-align:center;
    color:white;
    border-radius:30px;
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(15px);
    box-shadow:0 0 40px rgba(255,255,255,.3);
    animation:show 1s;
}

@keyframes show{
    from{
        opacity:0;
        transform:scale(.7) rotate(-5deg);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

h1{
    font-size:38px;
    margin-bottom:20px;
}

.message{
    font-size:22px;
    line-height:1.7;
    min-height:130px;
}

button{
    margin-top:25px;
    padding:15px 40px;
    border:none;
    border-radius:50px;
    background:white;
    color:#ff416c;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    transition:.4s;
}

button:hover{
    transform:scale(1.15);
}

.heart{
    position:absolute;
    bottom:-20px;
    animation:rise linear infinite;
    font-size:25px;
}

@keyframes rise{
    from{
        transform:translateY(0) rotate(0);
        opacity:1;
    }
    to{
        transform:translateY(-110vh) rotate(360deg);
        opacity:0;
    }
}

.glow{
    animation:pulse 1.5s infinite;
}

@keyframes pulse{
    50%{
        text-shadow:0 0 25px white;
    }
}

.final{
    font-size:25px;
    color:#fff;
}
</style>

</head>

<body>

<div class="container" id="app">

<h1 class="glow">Welcome Zainab ❤️</h1>

<div class="message">
I created something special only for you babyy 💕
<br>
Click below and open my heart ❤️
</div>

<button onclick="next()">Start Love Journey 💖</button>

</div>


<script>

let count=0;

const texts=[

`
Zainab babyy ❤️<br><br>
From the moment you came into my life,
everything became more beautiful ✨
`,

`
You are my happiness, my smile and my favorite person 🥰<br><br>
Your smile is my favorite thing in this world ❤️
`,

`
Babyy ❤️<br><br>
No matter what happens,
I will always care for you and stand beside you 💕
`,

`
You are the dream I never want to wake up from 🌹<br><br>
I love you more than words can ever explain ❤️
`,

`
My beautiful Zainab ❤️<br><br>
Thank you for being my peace,
my happiness and my forever person 💖
`

];


function next(){

count++;

let app=document.getElementById("app");

if(count<=texts.length){

app.innerHTML=`

<h1 class="glow">For You Zainab ❤️</h1>

<div class="message">
${texts[count-1]}
</div>

<button onclick="next()">
${count==texts.length?"Final Surprise 💝":"Next Message ❤️"}
</button>

`;

}

else{

app.innerHTML=`

<h1 class="glow">Forever Yours ❤️</h1>

<div class="message final">

I LOVE YOU BABYY ❤️🥹
<br><br>

You are my special one,
my happiness and my forever love 💕

</div>

<h2 style="margin-top:30px;">
Created by your hubby Zaim ❤️
</h2>

`;

}

}


// hearts generator

setInterval(()=>{

let heart=document.createElement("div");

heart.className="heart";
heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";
heart.style.animationDuration=(3+Math.random()*5)+"s";

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},7000);

},300);


</script>

</body>
</html>
